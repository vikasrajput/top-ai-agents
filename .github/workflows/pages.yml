name: Publish public directory
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage published files only
        run: |
          mkdir _site
          for path in index.html README.md robots.txt sitemap.xml .nojekyll assets data categories projects methodology changelog; do
            if [ -e "$path" ]; then cp -R "$path" _site/; fi
          done
          test -f _site/index.html
          test -f _site/data/directory.json
          test -f _site/sitemap.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
